  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    /* 自訂動畫與經典 Jeopardy 特效 */
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
    
    body {
      font-family: 'Nunito', 'Microsoft JhengHei', sans-serif;
      /* 傳統的深色攝影棚背景 */
      background-color: #000428;
      background-image: radial-gradient(circle at center, #001060 0%, #000428 100%);
      color: #ffffff;
      overflow-x: hidden;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
    .confetti-piece {
      position: absolute; width: 12px; height: 12px; animation: fall linear forwards; z-index: 9999;
    }
    @keyframes modalShake {
      0%, 100% { transform: translateX(0) scale(1); }
      20%, 60% { transform: translateX(-10px) scale(0.98); }
      40%, 80% { transform: translateX(10px) scale(0.98); }
    }
    .modal-shake { animation: modalShake 0.4s ease-in-out; }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes zoomInSpin {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .daily-double-anim { animation: zoomInSpin 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes pulseFlash {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    .pulse-flash { animation: pulseFlash 1.5s infinite; }
    
    /* 經典藍色題板陰影 */
    .jeopardy-board {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 6px solid #000000;
      background-color: #000000;
      gap: 6px !important; /* 加粗格線 */
    }
    
    .jeopardy-cell {
      background-color: #060ce9;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }
    .jeopardy-cell:hover {
      background-color: #1a20ff;
    }
    .jeopardy-text-shadow {
      text-shadow: 3px 3px 0 rgba(0,0,0,1);
    }
    
    /* 隱藏捲軸但允許滾動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>

          { points: 300, q: "重組：很多 / 我 / 動物 / 看到", a: "我看到很多動物。" },
          { points: 400, q: "重組：以前 / 醫生 / 外婆 / 是", a: "外婆以前是醫生。" },
          { points: 500, q: "重組：有意思 / 網路電話 / 真", a: "網路電話真有意思。" }
        ]
      }
    ];

    const teamColors = ['bg-rose-600', 'bg-blue-600', 'bg-emerald-600', 'bg-purple-600', 'bg-amber-600', 'bg-teal-600', 'bg-indigo-600', 'bg-pink-600'];

    const parseCSVRow = (str) => {
      let result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < str.length; i++) {
        let char = str[i];
        if (char === '"') inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
        else current += char;
      }
      result.push(current.trim());
      return result.map(s => s.replace(/^"|"$/g, '').replace(/""/g, '"'));
    };

    function App() {
      const [lang, setLang] = useState('zh-TW'); 
      const [isEditMode, setIsEditMode] = useState(false);
      const [showRules, setShowRules] = useState(false); 
      const [gameData, setGameData] = useState(initialGameData);
      const [teams, setTeams] = useState([
        { id: 1, name: '老虎隊 (Tiger)', score: 0, color: 'bg-rose-600' },
        { id: 2, name: '大象隊 (Elephant)', score: 0, color: 'bg-blue-600' }
      ]);
      
      const [answeredState, setAnsweredState] = useState({});
      const [activeCell, setActiveCell] = useState(null);
      const [showAnswer, setShowAnswer] = useState(false);
      
      const [isSoundEnabled, setIsSoundEnabled] = useState(true);
      const [celebration, setCelebration] = useState(false); 
      const [isShaking, setIsShaking] = useState(false); 
      
      const [dailyDoubles, setDailyDoubles] = useState([]);
      const [isDailyDoubleReveal, setIsDailyDoubleReveal] = useState(false);
      const [timeLeft, setTimeLeft] = useState(15);
      const [timerDuration, setTimerDuration] = useState(15); 
      
      const fileInputRef = useRef(null);
      const [dialog, setDialog] = useState(null);

      // 全螢幕狀態管理
      const [isFullscreen, setIsFullscreen] = useState(false);
      useEffect(() => {
        const handleFullscreenChange = () => {
          setIsFullscreen(!!document.fullscreenElement);
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
      }, []);

      const toggleFullScreen = () => {
        playSound('click');
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.log(`全螢幕失敗: ${err.message}`);
          });
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      };

      const generateDailyDoubles = (data) => {
        const numCols = data.length;
        const numRows = Math.max(...data.map(c => c.questions.length), 0);
        if (numCols === 0 || numRows === 0) return [];
        let dds = [];
        let attempts = 0;
        while(dds.length < 2 && attempts < 50) {
          let c = Math.floor(Math.random() * numCols);
          let r = Math.floor(Math.random() * numRows);
          if (data[c] && data[c].questions[r]) {
            let id = `${c}-${r}`;
            if(!dds.includes(id)) dds.push(id);
          }
          attempts++;
        }
        return dds;
      };

      useEffect(() => {
        setDailyDoubles(generateDailyDoubles(gameData));
      }, []);

      useEffect(() => {
        let timerId;
        if (activeCell && !showAnswer && !isDailyDoubleReveal && timeLeft > 0) {
          timerId = setTimeout(() => {
            setTimeLeft(t => t - 1);
            if (timeLeft <= 4 && timeLeft > 1) playSound('tick'); 
          }, 1000);
        } else if (timeLeft === 0 && activeCell && !showAnswer && !isDailyDoubleReveal) {
          playSound('wrong');
          triggerShake();
          setShowAnswer(true); 
        }
        return () => clearTimeout(timerId);
      }, [activeCell, showAnswer, isDailyDoubleReveal, timeLeft, isSoundEnabled]);

      const t = (key, replaceObj = null) => {
        let text = translations[lang][key] || key;
        if (replaceObj) {
          for (const [k, v] of Object.entries(replaceObj)) { text = text.replace(`{${k}}`, v); }
        }
        return text;
      };

      const showAlert = (message) => setDialog({ type: 'alert', message });
      const showConfirm = (message, onConfirm) => setDialog({ type: 'confirm', message, onConfirm });
      const closeDialog = () => setDialog(null);

      const playSound = (type) => {
        if (!isSoundEnabled) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);

          const now = ctx.currentTime;
          if (type === 'correct') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1); osc.frequency.setValueAtTime(783.99, now + 0.2); 
            gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5); osc.start(now); osc.stop(now + 0.5);
          } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(150, now + 0.4);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4); osc.start(now); osc.stop(now + 0.4);
          } else if (type === 'reveal') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15);
          } else if (type === 'click') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
          } else if (type === 'tick') {
            osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
            gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05); osc.start(now); osc.stop(now + 0.05);
          } else if (type === 'dailyDouble') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(392.00, now); osc.frequency.setValueAtTime(523.25, now + 0.15); osc.frequency.setValueAtTime(659.25, now + 0.3); osc.frequency.setValueAtTime(1046.50, now + 0.45); 
            gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 1.0); osc.start(now); osc.stop(now + 1.0);
          }
        } catch (e) { console.log("音效播放失敗", e); }
      };

      const triggerCelebration = () => { setCelebration(true); setTimeout(() => setCelebration(false), 2500); };
      const triggerShake = () => { setIsShaking(true); setTimeout(() => setIsShaking(false), 500); };

      const handleCellClick = (catIndex, qIndex, question) => {
        const cellId = `${catIndex}-${qIndex}`;
        if (answeredState[cellId]) return;
        if (!question.q) return; 
        
        setTimeLeft(timerDuration); 
        const isDD = dailyDoubles.includes(cellId);
        
        setActiveCell({ catIndex, qIndex, ...question, points: isDD ? question.points * 2 : question.points, isDailyDouble: isDD });
        if (isDD) { playSound('dailyDouble'); setIsDailyDoubleReveal(true); } 
        else { playSound('click'); setIsDailyDoubleReveal(false); }
        setShowAnswer(false);
      };

      const markAnswered = () => {
        if (activeCell) setAnsweredState(prev => ({ ...prev, [`${activeCell.catIndex}-${activeCell.qIndex}`]: true }));
      };

      const handleAwardPoints = (teamId, points) => {
        playSound('correct'); triggerCelebration(); 
        setTeams(teams.map(team => team.id === teamId ? { ...team, score: team.score + points } : team));
        markAnswered(); setActiveCell(null);
      };

      const handleSkip = () => {
        playSound('wrong'); triggerShake(); 
        setTimeout(() => { markAnswered(); setActiveCell(null); }, 500); 
      };

      const handleRevealAnswer = () => { playSound('reveal'); setShowAnswer(true); };

      const handleManualScore = (teamId, amount) => {
        playSound('click');
        setTeams(teams.map(team => team.id === teamId ? { ...team, score: team.score + amount } : team));
      };

      const resetGame = () => {
        playSound('click');
        showConfirm(t('confirmReset'), () => {
          setTeams(teams.map(t => ({ ...t, score: 0 })));
          setAnsweredState({}); setDailyDoubles(generateDailyDoubles(gameData)); setActiveCell(null); setShowAnswer(false);
        });
      };

      const handleAddTeam = () => {
        playSound('click');
        const newId = teams.length > 0 ? Math.max(...teams.map(t => t.id)) + 1 : 1;
        const color = teamColors[teams.length % teamColors.length];
        setTeams([...teams, { id: newId, name: `${t('newTeamPrefix')} ${newId}`, score: 0, color }]);
      };

      const handleRemoveTeam = (id) => {
        playSound('click');
        if (teams.length <= 1) { showAlert(t('keepOneTeam')); return; }
        setTeams(teams.filter(t => t.id !== id));
      };

      const updateGameData = (updater) => {
        const newData = JSON.parse(JSON.stringify(gameData));
        updater(newData); setGameData(newData);
      };

      const handleSaveEdit = () => {
        playSound('click');
        showConfirm(t('confirmSave'), () => {
          setTeams(teams.map(t => ({ ...t, score: 0 })));
          setAnsweredState({}); setDailyDoubles(generateDailyDoubles(gameData)); setIsEditMode(false);
        });
      };

      const handleFileUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const text = e.target.result;
            const lines = text.split(/\r?\n/).filter(line => line.trim());
            let startIndex = 0;
            if (lines[0].includes('分類') || lines[0].includes('Category') || lines[0].includes('题目')) startIndex = 1;

            const newCategoriesMap = {};
            for (let i = startIndex; i < lines.length; i++) {
              const row = parseCSVRow(lines[i]);
              if (row.length >= 4) {
                const catName = row[0] || "未分類";
                const points = parseInt(row[1]) || (newCategoriesMap[catName]?.length * 100 + 100) || 100;
                const q = row[2]; const a = row[3];
                if (!newCategoriesMap[catName]) newCategoriesMap[catName] = [];
                newCategoriesMap[catName].push({ points, q, a });
              }
            }
            const newGameData = Object.keys(newCategoriesMap).map(catName => ({ category: catName, questions: newCategoriesMap[catName] }));
            if (newGameData.length === 0) { showAlert(t('errCSVFormat')); return; }
            setGameData(newGameData); setDailyDoubles(generateDailyDoubles(newGameData)); showAlert(t('successImport', { n: newGameData.length }));
          } catch (error) { showAlert(t('errCSVRead')); console.error(error); }
          if (fileInputRef.current) fileInputRef.current.value = '';
        };
        reader.readAsText(file, "UTF-8");
      };

      // 取得語言縮寫 (配合側邊欄小空間)
      const getLangLabel = () => {
        if(lang === 'zh-TW') return '繁中';
        if(lang === 'zh-CN') return '简中';
        return 'EN';
      };

      const numCategories = Math.max(gameData.length, 1);
      const maxQuestionsPerCategory = Math.max(...gameData.map(c => c.questions.length), 5);
      const rowIndices = Array.from({length: maxQuestionsPerCategory}, (_, i) => i);

      // 共用的控制列按鈕樣式 (收納在標題區的右側網格中，固定寬度確保整齊)
      const headerControlBtnClass = "relative flex items-center justify-start gap-1.5 px-2.5 py-1.5 bg-[#001060] hover:bg-blue-800 text-white rounded-lg transition-all border-[2px] border-black shadow-[2px_2px_0_rgba(0,0,0,1)] active:shadow-none active:translate-y-0.5 active:translate-x-0.5 w-[110px] overflow-hidden cursor-pointer";

      // --- UI 渲染部分 ---
      
      // 編輯模式 UI 
      if (isEditMode) {
        return (
          <div className="min-h-screen p-4 lg:p-8 bg-gray-50 text-gray-800 flex flex-col absolute inset-0 z-50">
            <div className="max-w-6xl mx-auto bg-white rounded-3xl overflow-hidden w-full flex-1 mb-6 flex flex-col shadow-2xl">
              {/* Edit Header */}
              <div className="bg-blue-800 p-5 text-white flex flex-col md:flex-row justify-between items-center sticky top-0 z-10 shadow-lg">
                <h1 className="text-2xl font-black flex items-center gap-3">
                  <SvgIcon name="settings" className="w-7 h-7" /> {t('editTitle')}
                </h1>
                <div className="flex flex-col md:flex-row items-center gap-4 mt-4 md:mt-0">
                  <div className="flex items-center gap-2 border-r border-white/30 pr-4">
                    <SvgIcon name="globe" className="w-5 h-5 text-white" />
                    <select value={lang} onChange={(e) => { playSound('click'); setLang(e.target.value); }} className="bg-transparent text-sm font-bold text-white outline-none cursor-pointer">
                      <option value="zh-TW" className="text-black">繁體中文</option>
                      <option value="zh-CN" className="text-black">简体中文</option>
                      <option value="en" className="text-black">English</option>
                    </select>
                  </div>
                  <button onClick={handleSaveEdit} className="bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-2.5 px-6 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md">
                    <SvgIcon name="save" className="w-5 h-5" /> <span>{t('saveReturn')}</span>
                  </button>
                </div>
              </div>
              
              <div className="p-6 lg:p-10 space-y-10 overflow-y-auto">
                <section className="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                  <h2 className="text-2xl font-black text-gray-800 flex items-center gap-3 mb-6">
                    <SvgIcon name="clock" className="w-6 h-6 text-blue-600" /> {t('timerSetting')}
                  </h2>
                  <div className="flex items-center gap-4 bg-gray-50 p-4 rounded-xl border border-gray-200 w-fit">
                    <button onClick={() => { playSound('click'); setTimerDuration(Math.max(5, timerDuration - 5)); }} className="p-3 bg-white hover:bg-gray-100 text-gray-600 rounded-lg shadow-sm border border-gray-200">
                      <SvgIcon name="minus" className="w-6 h-6" />
                    </button>
                    <div className="text-5xl font-black text-blue-800 w-24 text-center">{timerDuration}</div>
                    <button onClick={() => { playSound('click'); setTimerDuration(timerDuration + 5); }} className="p-3 bg-white hover:bg-gray-100 text-gray-600 rounded-lg shadow-sm border border-gray-200">
                      <SvgIcon name="plus" className="w-6 h-6" />
                    </button>
                    <span className="text-gray-500 font-bold ml-3 text-lg">秒 (Sec)</span>
                  </div>
                </section>

                <section className="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="text-2xl font-black text-gray-800 flex items-center gap-3">
                      <SvgIcon name="users" className="w-6 h-6 text-blue-600" /> {t('teamSettings', { n: teams.length })}
                    </h2>
                    <button onClick={handleAddTeam} className="bg-blue-600 hover:bg-blue-700 text-white py-2 px-5 rounded-xl flex items-center gap-2 text-sm font-bold shadow-md">
                      <SvgIcon name="plus" className="w-4 h-4" /> {t('addTeam')}
                    </button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {teams.map((team) => (
                      <div key={team.id} className="flex items-center gap-3 bg-gray-50 p-4 rounded-xl shadow-sm border border-gray-200">
                        <div className={`w-5 h-12 rounded-full shadow-inner ${team.color}`}></div>
                        <input type="text" value={team.name} onChange={(e) => handleTeamNameChange(team.id, e.target.value)} className="flex-1 border-b-2 border-gray-200 focus:border-blue-500 outline-none p-2 font-bold text-gray-700 text-lg bg-transparent" placeholder={t('enterTeamName')}/>
                        <button onClick={() => handleRemoveTeam(team.id)} className="text-rose-400 hover:text-rose-600 hover:bg-rose-50 p-2.5 rounded-lg transition-colors"><SvgIcon name="trash" className="w-5 h-5" /></button>
                      </div>
                    ))}
                  </div>
                </section>
                
                <section className="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-5">
                    <h2 className="text-2xl font-black text-gray-800 flex items-center gap-3">
                      <SvgIcon name="settings" className="w-6 h-6 text-blue-600" /> {t('questionEditor', { n: gameData.length })}
                    </h2>
                    <div className="flex flex-wrap gap-3">
                      <input type="file" accept=".csv" onChange={handleFileUpload} ref={fileInputRef} className="hidden" />
                      <button onClick={() => { playSound('click'); fileInputRef.current.click(); }} className="flex items-center gap-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 py-2.5 px-5 rounded-xl font-bold transition-colors">
                        <SvgIcon name="upload" className="w-5 h-5" /> {t('importCSV')}
                      </button>
                    </div>
                  </div>
                  <div className="space-y-10">
                    {gameData.map((category, catIdx) => (
                      <div key={catIdx} className="bg-gray-50 border-2 border-gray-200 rounded-2xl overflow-hidden">
                        <div className="bg-gray-200 p-5 border-b border-gray-300 flex items-center gap-4">
                          <span className="font-black text-gray-500 whitespace-nowrap text-lg">{t('categoryLabel', { n: catIdx + 1 })}</span>
                          <input type="text" value={category.category} onChange={(e) => updateGameData(data => data[catIdx].category = e.target.value)} className="flex-1 text-xl font-black p-3 rounded-xl border border-gray-300 focus:border-blue-500 focus:ring-4 outline-none text-gray-800" placeholder={t('enterCatName')}/>
                        </div>
                        <div className="p-6 space-y-5">
                          {category.questions.map((q, qIdx) => (
                            <div key={qIdx} className="flex flex-col lg:flex-row gap-5 items-start lg:items-center bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                              <div className="flex-shrink-0 font-black text-blue-600 bg-blue-50 px-4 py-2 rounded-xl flex flex-col items-center border border-blue-100">
                                <span className="text-xs uppercase tracking-wider text-blue-400">{t('pointsLabel')}</span>
                                <input type="number" value={q.points} onChange={(e) => updateGameData(data => data[catIdx].questions[qIdx].points = Number(e.target.value))} className="w-20 text-center font-black text-2xl bg-transparent border-b-2 border-blue-200 focus:border-blue-500 outline-none mt-1"/>
                              </div>
                              <div className="flex-1 w-full space-y-3">
                                <div className="flex gap-3 items-start">
                                  <span className="font-black text-gray-300 mt-2 text-xl">Q</span>
                                  <textarea value={q.q} onChange={(e) => updateGameData(data => data[catIdx].questions[qIdx].q = e.target.value)} className="flex-1 p-3 rounded-xl border border-gray-200 focus:border-blue-500 outline-none resize-none h-14 font-bold text-gray-700" placeholder={t('enterQuestion')}/>
                                </div>
                                <div className="flex gap-3 items-center">
                                  <span className="font-black text-emerald-400 text-xl">A</span>
                                  <input type="text" value={q.a} onChange={(e) => updateGameData(data => data[catIdx].questions[qIdx].a = e.target.value)} className="flex-1 p-3 rounded-xl border border-gray-200 focus:border-emerald-500 outline-none font-bold text-emerald-700" placeholder={t('enterAnswer')}/>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            </div>
            
            {dialog && (
              <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[100]">
                <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full text-center pop-in">
                  <p className="text-xl font-black text-gray-800 mb-8">{dialog.message}</p>
                  <div className="flex justify-center gap-4">
                    {dialog.type === 'confirm' && (<button onClick={() => { playSound('click'); closeDialog(); }} className="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl font-bold">{t('btnCancel')}</button>)}
                    <button onClick={() => { playSound('click'); if (dialog.onConfirm) dialog.onConfirm(); closeDialog(); }} className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-md">{t('btnConfirm')}</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // --- 主要遊戲畫面 ---
      return (
        <div className="min-h-screen p-3 lg:p-6 select-none flex flex-col relative overflow-hidden bg-gradient-to-br from-[#000428] to-[#001060]">
          
          {celebration && (
            <div className="fixed inset-0 pointer-events-none z-[200]">
              {Array.from({ length: 120 }).map((_, i) => (
                <div key={i} className="confetti-piece rounded-sm shadow-sm" 
                  style={{
                    left: `${Math.random() * 100}vw`,
                    backgroundColor: ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'][Math.floor(Math.random()*7)],
                    animationDuration: `${Math.random() * 2 + 1.5}s`,
                    animationDelay: `${Math.random() * 0.2}s`,
                    width: `${Math.random() * 12 + 6}px`, height: `${Math.random() * 12 + 6}px`
                  }} 
                />
              ))}
            </div>
          )}

          {/* === 標題與功能控制列 (強制水平排列：標題、計分板、2直列控制台) === */}
          <header className="flex flex-row items-center justify-between w-full max-w-[100rem] mx-auto p-4 bg-[#001060] border-[4px] border-black rounded-2xl mb-4 shadow-[0_10px_30px_rgba(0,0,0,0.5)] z-10 gap-4 overflow-x-auto no-scrollbar">
            
            {/* 左側：大標題 */}
            <div className="flex items-center gap-3 shrink-0">
              <SvgIcon name="play" className="text-[#ffcc00] w-12 h-12 drop-shadow-md" />
              <div>
                <h1 className="text-3xl lg:text-4xl font-black text-white tracking-widest drop-shadow-[3px_3px_0_rgba(0,0,0,1)] uppercase leading-none mb-1">
                  {t('appTitle')}
                </h1>
                <p className="text-blue-300 font-bold tracking-widest text-[10px] lg:text-xs uppercase pl-1">{t('appSubtitle')}</p>
              </div>
            </div>

            {/* 中央：隊伍計分板 (強制水平排列橫向展開) */}
            <div className="flex flex-row items-center justify-center gap-3 lg:gap-4 flex-1 shrink-0 px-2">
              {teams.map((team) => (
                <div key={team.id} className="flex flex-col items-center bg-black p-2 lg:p-3 rounded-xl shadow-[0_4px_0_rgba(255,255,255,0.15)] border border-white/20 min-w-[130px] shrink-0 transition-transform hover:-translate-y-1">
                  <div className={`${team.color} text-white px-2 py-1 rounded-sm font-black text-xs lg:text-sm mb-1.5 text-center w-full truncate tracking-wider uppercase border border-black shadow-sm`}>
                    {team.name}
                  </div>
                  <div className="text-3xl lg:text-4xl font-black text-[#ffcc00] mb-2 tracking-tighter jeopardy-text-shadow">
                    {team.score}
                  </div>
                  {/* 加扣分按鈕 */}
                  <div className="flex flex-row gap-1.5 w-full">
                    <button onClick={() => handleManualScore(team.id, 100)} className="flex-1 flex justify-center items-center gap-1 py-1 bg-emerald-600/30 hover:bg-emerald-600/60 text-emerald-300 rounded border border-emerald-500/30 transition-colors" title={t('add100')}>
                      <SvgIcon name="plus" className="w-3 h-3 lg:w-4 lg:h-4" />
                      <span className="text-[10px] lg:text-xs font-black tracking-widest whitespace-nowrap">{t('addBtn')}</span>
                    </button>
                    <button onClick={() => handleManualScore(team.id, -100)} className="flex-1 flex justify-center items-center gap-1 py-1 bg-rose-600/30 hover:bg-rose-600/60 text-rose-300 rounded border border-rose-500/30 transition-colors" title={t('sub100')}>
                      <SvgIcon name="minus" className="w-3 h-3 lg:w-4 lg:h-4" />
                      <span className="text-[10px] lg:text-xs font-black tracking-widest whitespace-nowrap">{t('subBtn')}</span>
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* 右側：功能控制列 (強制定在最右邊，排成 2直列 的網格) */}
            <div className="grid grid-cols-2 gap-2 shrink-0">
              
              <div className={headerControlBtnClass}>
                <span className="text-[13px] leading-none shrink-0 pointer-events-none ml-1">🌐</span>
                <span className="text-[10px] lg:text-[11px] font-bold whitespace-nowrap uppercase tracking-widest text-white pointer-events-none ml-1">
                  {getLangLabel()}
                </span>
                <select value={lang} onChange={(e) => { playSound('click'); setLang(e.target.value); }} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                  <option value="zh-TW">繁體中文</option>
                  <option value="zh-CN">简体中文</option>
                  <option value="en">English</option>
                </select>
              </div>

              <button onClick={() => { playSound('click'); setIsSoundEnabled(!isSoundEnabled); }} className={headerControlBtnClass}>
                {isSoundEnabled ? <SvgIcon name="volume" className="w-4 h-4 text-emerald-400 shrink-0" /> : <SvgIcon name="mute" className="w-4 h-4 text-rose-400 shrink-0" />}
                <span className="text-[10px] lg:text-[11px] font-bold whitespace-nowrap uppercase tracking-widest">{isSoundEnabled ? t('soundOn') : t('soundOff')}</span>
              </button>

              <button onClick={() => { playSound('click'); setShowRules(true); }} className={headerControlBtnClass}>
                <SvgIcon name="info" className="w-4 h-4 text-sky-400 shrink-0" />
                <span className="text-[10px] lg:text-[11px] font-bold whitespace-nowrap uppercase tracking-widest">{t('rulesBtn')}</span>
              </button>
              
              <button onClick={() => { playSound('click'); setIsEditMode(true); }} className={headerControlBtnClass}>
                <SvgIcon name="settings" className="w-4 h-4 text-purple-400 shrink-0" />
                <span className="text-[10px] lg:text-[11px] font-bold whitespace-nowrap uppercase tracking-widest">{t('settings')}</span>
              </button>

              <button onClick={resetGame} className={headerControlBtnClass.replace('hover:bg-blue-800', 'hover:bg-rose-800')}>
                <SvgIcon name="refresh" className="w-4 h-4 text-rose-400 shrink-0" />
                <span className="text-[10px] lg:text-[11px] font-bold whitespace-nowrap uppercase tracking-widest">{t('resetScores')}</span>
              </button>

              <button onClick={toggleFullScreen} className={headerControlBtnClass.replace('hover:bg-blue-800', 'hover:bg-emerald-800')}>
                {isFullscreen ? <SvgIcon name="minimize" className="w-4 h-4 text-emerald-400 shrink-0" /> : <SvgIcon name="maximize" className="w-4 h-4 text-emerald-400 shrink-0" />}
                <span className="text-[10px] lg:text-[11px] font-bold whitespace-nowrap uppercase tracking-widest">{isFullscreen ? t('exitFullscreen') : t('fullscreen')}</span>
              </button>
            </div>
          </header>

          {/* === 遊戲主要區塊：純經典題板 (佔滿剩餘全部面積) === */}
          <div className="flex-1 max-w-[100rem] mx-auto w-full relative z-10 flex flex-col justify-center items-stretch min-h-[400px]">
            <div className="jeopardy-board p-2 lg:p-3 rounded-lg grid w-full h-full flex-1" style={{ gridTemplateColumns: `repeat(${numCategories}, minmax(0, 1fr))` }}>
              
              {/* 分類標題 Header */}
              {gameData.map((category, idx) => (
                <div key={`header-${idx}`} className="bg-[#000a8b] text-white font-black text-center p-3 lg:p-5 flex items-center justify-center text-sm lg:text-xl xl:text-3xl border-4 border-black uppercase tracking-widest shadow-inner break-words leading-tight">
                  <span className="drop-shadow-[2px_2px_0_rgba(0,0,0,1)]">{category.category}</span>
                </div>
              ))}
              
              {/* 題目按鈕 */}
              {rowIndices.map((rowIdx) => (
                <React.Fragment key={`row-${rowIdx}`}>
                  {gameData.map((category, colIdx) => {
                    const question = category.questions[rowIdx];
                    const cellId = `${colIdx}-${rowIdx}`;
                    const isAnswered = answeredState[cellId];
                    if (!question) return <div key={cellId} className="bg-black rounded-sm min-h-[60px] lg:min-h-[100px]"></div>;

                    return (
                      <div key={cellId} onClick={() => handleCellClick(colIdx, rowIdx, question)}
                        className={`
                          flex items-center justify-center text-4xl lg:text-5xl xl:text-7xl font-black cursor-pointer transition-all duration-200 border-[4px] border-black
                          ${isAnswered 
                            ? 'bg-[#000428] text-transparent pointer-events-none' 
                            : 'jeopardy-cell text-[#ffcc00]'}
                          min-h-[60px] lg:min-h-[100px]
                        `}
                      >
                        {!isAnswered && (
                          <span className="jeopardy-text-shadow">{question.points}</span>
                        )}
                      </div>
                    );
                  })}
                </React.Fragment>
              ))}
            </div>
          </div>

          {/* 遊戲規則彈出視窗 */}
          {showRules && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-[300]">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden pop-in flex flex-col border-4 border-blue-800 text-gray-800">
                <div className="bg-blue-800 p-6 flex justify-between items-center text-white border-b-4 border-black">
                  <h2 className="text-2xl font-black flex items-center gap-3 tracking-widest">
                    {t('rulesTitle')}
                  </h2>
                  <button onClick={() => { playSound('click'); setShowRules(false); }} className="hover:bg-blue-600 p-1 rounded-sm border-2 border-transparent hover:border-white transition-colors">
                    <SvgIcon name="x" className="w-8 h-8" />
                  </button>
                </div>
                <div className="p-8 lg:p-10 space-y-6 text-lg font-bold bg-gray-100 overflow-y-auto max-h-[60vh]">
                  <div className="flex items-start gap-4"><span className="text-3xl leading-none">🎯</span> <span className="pt-1">{t('rule1')}</span></div>
                  <div className="flex items-start gap-4"><span className="text-3xl leading-none">⏱️</span> <span className="pt-1">{t('rule2', { timer: timerDuration })}</span></div>
                  <div className="flex items-start gap-4"><span className="text-3xl leading-none">🌟</span> <span className="pt-1 text-yellow-700">{t('rule3')}</span></div>
                  <div className="flex items-start gap-4"><span className="text-3xl leading-none">⚖️</span> <span className="pt-1">{t('rule4')}</span></div>
                  <div className="flex items-start gap-4"><span className="text-3xl leading-none">🏆</span> <span className="pt-1">{t('rule5')}</span></div>
                </div>
                <div className="p-6 bg-gray-200 flex justify-center border-t-4 border-gray-300">
                  <button onClick={() => { playSound('click'); setShowRules(false); }} className="bg-blue-800 hover:bg-blue-700 text-white font-black text-xl px-12 py-4 rounded shadow-[4px_4px_0_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1 transition-all border-2 border-black tracking-widest">
                    {t('btnGotIt')}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 題目與答案彈出視窗 */}
          {activeCell && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 lg:p-12 z-[100]">
              {isDailyDoubleReveal ? (
                 <div className="flex flex-col items-center justify-center daily-double-anim w-full h-full">
                    <SvgIcon name="star" className="w-40 h-40 text-[#ffcc00] mb-8 pulse-flash fill-[#ffcc00] drop-shadow-[0_0_50px_rgba(255,204,0,1)]" />
                    <h1 className="text-6xl lg:text-8xl font-black text-white mb-6 drop-shadow-[5px_5px_0_rgba(0,0,0,1)] tracking-widest">
                      {t('dailyDouble')}
                    </h1>
                    <p className="text-4xl lg:text-5xl font-black text-[#ffcc00] mb-12 drop-shadow-[3px_3px_0_rgba(0,0,0,1)] tracking-widest">
                      {t('doublePoints')} <span className="text-white border-4 border-white px-4 py-1 bg-black ml-4">{activeCell.points}</span>
                    </p>
                    <button 
                      onClick={() => { playSound('click'); setIsDailyDoubleReveal(false); }}
                      className="bg-[#ffcc00] hover:bg-yellow-400 text-black font-black text-3xl px-16 py-5 shadow-[6px_6px_0_rgba(255,255,255,0.3)] hover:shadow-[4px_4px_0_rgba(255,255,255,0.3)] active:translate-y-1 transition-all border-4 border-black"
                    >
                      {t('showQuestion')}
                    </button>
                 </div>
              ) : (
                <div className={`bg-[#060ce9] w-full h-full max-w-7xl max-h-[90vh] rounded-xl shadow-[0_0_50px_rgba(0,0,0,1)] flex flex-col overflow-hidden border-[8px] border-black ${isShaking ? 'modal-shake' : 'pop-in'}`}>
                  
                  {/* 倒數計時進度條 */}
                  {!showAnswer && (
                    <div className="w-full h-4 bg-black border-b-4 border-black">
                      <div className={`h-full transition-all duration-1000 ease-linear ${timeLeft <= 3 ? 'bg-red-500' : 'bg-white'}`} style={{ width: `${(timeLeft / timerDuration) * 100}%` }}></div>
                    </div>
                  )}

                  {/* 標題與關閉按鈕 */}
                  <div className="flex justify-between items-center p-6 border-b-4 border-black bg-black/20">
                     <span className="font-black text-2xl lg:text-3xl flex items-center gap-4 text-white drop-shadow-[2px_2px_0_rgba(0,0,0,1)] tracking-widest uppercase">
                      {activeCell.isDailyDouble ? <SvgIcon name="star" className="w-10 h-10 text-[#ffcc00]" /> : null} 
                      {gameData[activeCell.catIndex].category}
                      <span className="text-[#ffcc00] ml-4">{activeCell.points} {t('pts')}</span>
                    </span>
                    <button onClick={() => { playSound('click'); setActiveCell(null); }} className="text-white hover:text-[#ffcc00] transition-colors"><SvgIcon name="x" className="w-10 h-10" /></button>
                  </div>

                  {/* 題目區塊 */}
                  <div className="flex-1 flex flex-col items-center justify-center p-8 lg:p-16 text-center relative overflow-y-auto">
                    
                    {timeLeft === 0 && !showAnswer && (
                       <div className="text-red-500 font-black text-4xl mb-8 uppercase tracking-widest drop-shadow-[2px_2px_0_rgba(0,0,0,1)] animate-bounce">{t('timeUp')}</div>
                    )}

                    <h2 className="text-4xl lg:text-6xl xl:text-7xl font-black text-white leading-snug mb-12 uppercase drop-shadow-[4px_4px_0_rgba(0,0,0,0.8)] tracking-wide">
                      {activeCell.q}
                    </h2>
                    
                    {showAnswer ? (
                      <div className="pop-in w-full flex justify-center mt-8">
                        <div className="text-[#ffcc00] text-5xl lg:text-7xl xl:text-8xl font-black drop-shadow-[5px_5px_0_rgba(0,0,0,1)] tracking-widest">
                          {activeCell.a}
                        </div>
                      </div>
                    ) : (
                      <button onClick={handleRevealAnswer} className="bg-white hover:bg-gray-200 text-black font-black text-2xl lg:text-3xl px-12 py-5 border-4 border-black shadow-[6px_6px_0_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1 transition-all mt-10 tracking-widest uppercase">
                        {t('showAnswer')}
                      </button>
                    )}
                  </div>

                  {/* Modal Footer / 給分按鈕 */}
                  {showAnswer && (
                    <div className="bg-black/40 p-6 lg:p-8 border-t-4 border-black flex flex-col items-center gap-6">
                      <p className="text-white font-black text-2xl tracking-widest uppercase drop-shadow-md">{t('whoGotItRight')}</p>
                      <div className="flex flex-wrap justify-center gap-4 w-full">
                        {teams.map(team => (
                          <button key={team.id} onClick={() => handleAwardPoints(team.id, activeCell.points)} className={`${team.color} hover:brightness-110 text-white font-black text-xl lg:text-2xl px-8 py-4 border-4 border-black shadow-[4px_4px_0_rgba(0,0,0,0.5)] active:translate-y-1 active:translate-x-1 active:shadow-none flex items-center gap-3 transition-all tracking-widest uppercase`}>
                            <SvgIcon name="check" className="w-6 h-6 lg:w-8 lg:h-8" /> {t('awardTeam')} {team.name}
                          </button>
                        ))}
                        <button onClick={handleSkip} className="bg-gray-300 hover:bg-gray-400 text-black font-black text-xl lg:text-2xl px-8 py-4 border-4 border-black shadow-[4px_4px_0_rgba(0,0,0,0.5)] active:translate-y-1 active:translate-x-1 active:shadow-none transition-all tracking-widest uppercase">
                          {t('skip')}
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* 警告彈出視窗 */}
          {dialog && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[500]">
              <div className="bg-white border-4 border-black p-8 max-w-sm w-full text-center pop-in shadow-[10px_10px_0_rgba(0,0,0,1)]">
                <p className="text-2xl font-black text-black mb-8">{dialog.message}</p>
                <div className="flex justify-center gap-4">
                  {dialog.type === 'confirm' && (<button onClick={() => { playSound('click'); closeDialog(); }} className="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-black border-2 border-black font-black shadow-[3px_3px_0_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1">{t('btnCancel')}</button>)}
                  <button onClick={() => { playSound('click'); if (dialog.onConfirm) dialog.onConfirm(); closeDialog(); }} className="px-6 py-3 bg-[#060ce9] hover:bg-blue-800 text-white border-2 border-black font-black shadow-[3px_3px_0_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1">{t('btnConfirm')}</button>
                </div>
              </div>
            </div>
          )}
          
          <footer className="text-center text-blue-200/50 py-4 text-xs font-bold mt-auto relative z-10 px-4 tracking-widest uppercase">
            Powered by Gemini | Sophia老師的AI練習本
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
